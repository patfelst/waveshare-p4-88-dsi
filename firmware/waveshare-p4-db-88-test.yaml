# Adapted from /config/esphome/waveshare-p4-db-88-test.yaml.
# Home Assistant entity names use examples. See README for dependencies.
# For initial hardware verification, start with p4-88-bringup.yaml.
# Waveshare ESP32-P4-WIFI6-DB + 8.8-DSI-TOUCH-A rack monitor.
# Board: https://docs.waveshare.com/ESP32-P4-WIFI6-DB
# Display source: waveshareteam/Waveshare-ESP32-components commit
# 07d2d0630ec03bf23a21d8f28c1c815fe00a4fa4, display/lcd/esp_lcd_ota7290b.
# P4 silicon revision 3.2 and 32MB flash confirmed by serial flash/boot logs.
# Native hardware bars and software framebuffer verified on this board/display.
# Shared UI palette; all colour values are unchanged.
substitutions:
  color_navy: "0x102A43"
  color_lcd_ink: "0x20291D"
  color_lcd_muted: "0x46503E"
  color_lcd_segment_off: "0xADB89A"
  color_pale_blue: "0xDCEEFF"
  color_splash_text: "0xE7ECEF"
  color_cyan: "0x00A9D6"
  color_nav_active: "0x8DC9FF"
  color_white: "0xFFFFFF"
  color_border_blue: "0xB5CEED"
  color_splash_background: "0x06111A"

esphome:
  name: waveshare-p4-db-88-test
  friendly_name: Waveshare P4 DB 8.8 Test
  min_version: 2026.9.1
  includes:
    - rack_history_bars.h
  build_flags:
    - -DLV_USE_CHART=1
  on_boot:
    - priority: 850
      then:
        # After I2C bus setup (1000), before display/touch setup.
        # Blocking waits deliberately keep display setup behind panel power-up.
        - lambda: |-
            // The named model supplies reset policy and the DCS command table.
            // Separate I2C control path, not DSI pixel/command traffic:
            // replay Waveshare's 0x95 control and 0x96 backlight startup writes.
            bool ok = id(panel_control).write_byte(0x95, 0x11);
            ok = id(panel_control).write_byte(0x95, 0x17) && ok;
            ok = id(panel_control).write_byte(0x96, 0x00) && ok;
            delay(100);
            ok = id(panel_control).write_byte(0x96, 0xFF) && ok;
            delay(1000);
            if (!ok) ESP_LOGE("panel_power", "Panel I2C power sequence failed at 0x45");
    - priority: -100
      then:
        - light.turn_on:
            id: panel_backlight
            brightness: 70%
        # Widget creation precedes the final display-size update. Reset any
        # initial scroll offset after LVGL has the landscape geometry.
        - lambda: |-
            auto *screen = id(ui).get_screen_active();
            lv_obj_update_layout(screen);
            lv_obj_scroll_to(screen, 0, 0, LV_ANIM_OFF);
        # Start the C5 after UI setup without an additional startup delay.
        # Extra watchdog time applies only to the blocking radio initialization.
        - lambda: |-
            ESP_LOGI("wifi_startup", "Starting C5 ESP-Hosted Wi-Fi after UI setup");
            ESP_LOGI("wifi_startup", "DMA heap before C5: %u free, %u largest block",
                     static_cast<unsigned>(heap_caps_get_free_size(MALLOC_CAP_DMA)),
                     static_cast<unsigned>(heap_caps_get_largest_free_block(MALLOC_CAP_DMA)));
            {
              watchdog::WatchdogManager startup_watchdog(30000);
              id(board_wifi).enable();
            }
            ESP_LOGI("wifi_startup", "Wi-Fi initialization returned; normal watchdog restored");
        - script.execute: study_screensaver_timer

    - priority: -300
      then:
        - lambda: |-
            // Read the installed C5 version once, after its updater setup at -200.
            const std::string &version = id(c5_firmware).update_info.current_version;
            lv_label_set_text_fmt(id(status_radio), "ESP32-C5-MINI-1U | ESP-Hosted %s / SDIO",
                                  version.empty() ? "unknown" : version.c_str());
        - lvgl.page.show: rack_page
        - script.execute: startup_splash

# Clean local backport of the upstream PR candidate. Only mipi_dsi is replaced.
# The named WAVESHARE-8.8-DSI-TOUCH-A model skips software reset, while retaining
# the normal DPI startup order. No panel-ID read or diagnostic startup flag.
# Its model definition supplies panel timings/commands; no C++ sequence override.
# Keep waveshare_pr_components beside this YAML for future builds and updates.
# This backport uses the proven pinned driver; the PR patch targets upstream dev.
external_components:
  - source:
      type: local
      path: waveshare_pr_components
    components: [mipi_dsi]
esp32:
  variant: esp32p4
  engineering_sample: false
  cpu_frequency: 360MHz
  flash_size: 32MB # External NOR flash, separate from the 32MB in-package PSRAM.
  framework:
    type: esp-idf
    # Let ordinary allocations fall back to PSRAM while protecting internal
    # RAM for DMA/tasks. The default CAPS_ALLOC-only mode leaves all normal
    # malloc/new allocations competing with SDIO for internal memory.
    sdkconfig_options:
      CONFIG_SPIRAM_USE_CAPS_ALLOC: "n"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "65536"
    # ESP-IDF host-side library used by esp32_hosted below. This pinned version
    # provides the P4-to-C5 transport; the C5 needs compatible slave firmware.
    components:
      - name: espressif/esp_hosted
        ref: "2.12.13"
    advanced:
      enable_idf_experimental_features: true
psram:
  mode: hex
  speed: 200MHz
# P4's internal adjustable regulator channel 3 powers the MIPI DSI PHY at 2.5 V.
# The PHY is the electrical interface that drives the high-speed display lanes.
# This is separate from the display's external 5 V supply and backlight setting.
esp_ldo:
  channel: 3
  voltage: 2.5V
logger:
  hardware_uart: UART0
  level: DEBUG
api:
  id: ha_api
  encryption:
    key: !secret api_key
  reboot_timeout: 0s
ota:
  - platform: esphome
# The ESP32-P4 has no integrated Wi-Fi radio. ESP-Hosted lets its ESPHome firmware
# use the board's ESP32-C5 wireless coprocessor over the dedicated SDIO bus.
# These pins connect the two chips on the PCB; they are not SD-card/display pins.
# wifi: below supplies the network credentials; this block supplies its transport.
# The pinned C5 firmware updater below is retained for radio firmware maintenance.
esp32_hosted:
  type: sdio
  variant: ESP32C5
  reset_pin: GPIO54
  active_high: true
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  sdio_frequency: 10MHz
  use_psram: true
# Keep the existing deferred C5 startup; Wi-Fi can select any AP for this SSID.
wifi:
  id: board_wifi
  enable_on_boot: false
  post_connect_roaming: true
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  reboot_timeout: 0s

# Shared low-speed control bus on GPIO7 (SDA) and GPIO8 (SCL).
# Confirmed scan addresses on this setup:
#   0x45: display control/backlight; used by panel_control and the light output.
#   0x5D: Goodix GT9271 touchscreen; accessed through ESPHome's gt911 driver.
#   0x18: onboard ES8311 audio codec; detected, but audio is not configured here.
# A camera, if fitted, can also share these lines for SCCB control.
# Image pixels travel over MIPI DSI, not over I2C; touch/control use this bus.
# Board reference: https://docs.waveshare.com/ESP32-P4-WIFI6-DB#peripheral-quick-reference
i2c:
  id: board_i2c
  sda: GPIO7
  scl: GPIO8
  frequency: 100kHz
  scan: true # Log responding addresses at startup; useful for wiring checks.
# Generic access to the display's controller at 0x45. Register 0x96 controls
# backlight brightness (0..255); register 0x95 is used in Waveshare's startup.
i2c_device:
  id: panel_control
  i2c_id: board_i2c
  address: 0x45
output:
  - platform: template
    id: backlight_output
    type: float
    write_action:
      - lambda: |-
          // Keep hardware dark while asleep without changing the selected brightness.
          const float level = id(ui).is_paused() ? 0.0f : state;
          const uint8_t value = static_cast<uint8_t>(level * 255.0f + 0.5f);
          const bool ok = id(panel_control).write_byte(0x96, value);
          if (!ok) ESP_LOGW("backlight", "I2C brightness write failed");
light:
  - platform: monochromatic
    id: panel_backlight
    name: Display Backlight
    output: backlight_output
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: ALWAYS_ON
    # Show the selected HA/slider brightness, not a transition or sleep output.
    on_state:
      - lambda: |-
          if (id(backlight_slider) == nullptr || id(brightness_value) == nullptr) return;
          const auto &selected = id(panel_backlight).remote_values;
          const int pct = selected.is_on()
              ? static_cast<int>(selected.get_brightness() * 100.0f + 0.5f) : 0;
          if (lv_slider_get_value(id(backlight_slider)) != pct)
            lv_slider_set_value(id(backlight_slider), pct, LV_ANIM_OFF);
          lv_label_set_text_fmt(id(brightness_value), "%d%%", pct);

# Native panel and touch orientation; LVGL rotates both clockwise together.
display:
  - platform: mipi_dsi
    id: lcd
    model: WAVESHARE-8.8-DSI-TOUCH-A
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: gt911
    id: touch
    display: lcd
    i2c_id: board_i2c
    address: 0x5D
    update_interval: 20ms
    on_touch:
      then:
        - script.stop: study_screensaver_timer
        - if:
            condition:
              lvgl.is_paused:
                id: ui
            then:
              - lvgl.resume:
                  lvgl_id: ui
    on_release:
      then:
        - script.execute: study_screensaver_timer

# Use Adelaide calendar days for the observed temperature extrema.
time:
  - platform: homeassistant
    id: rack_clock
    timezone: Australia/Adelaide
    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - script.execute: refresh_rack_values
      - seconds: "*"
        then:
          - script.execute: refresh_rack_clock
    on_time_sync:
      then:
        - script.execute: refresh_rack_values
        - script.execute: refresh_rack_clock

# Local telemetry plus the Atom S3R temperature imported through Home Assistant.
sensor:
# The Atom S3R is the temperature source; HA relays its TMP117 reading.
- platform: homeassistant
  id: rack_temperature
  name: Rack Temperature
  internal: false
  entity_id: sensor.example_rack_temperature
  unit_of_measurement: "°C"
  device_class: temperature
  state_class: measurement
  accuracy_decimals: 1
  on_value:
    then:
      - lambda: |-
          // Invalid/unavailable HA states hide live values; daily extrema reset independently.
          id(rack_source_available) = std::isfinite(x) && x >= -55.0f && x <= 125.0f;
          if (!id(rack_source_available)) return;
          id(rack_sample_seen) = true;
          id(rack_last_sample_ms) = millis();
          id(rack_sample_value) = x;
      - script.execute: refresh_rack
- platform: wifi_signal
  id: panel_wifi_rssi
  name: Panel Wi-Fi RSSI
  update_interval: 30s

# Local diagnostics: CPU die temperature is not an ambient-room measurement.
- platform: internal_temperature
  id: status_die_temperature
  name: CPU Die Temperature
  update_interval: 30s
- platform: uptime
  id: status_uptime_seconds
  internal: true
  update_interval: 15s

text_sensor:

# Match the 4B: PIR plus study mmWave zones 1 and 2.
- platform: homeassistant
  id: study_pir_state
  entity_id: binary_sensor.example_room_motion
  internal: true
  on_value:
    - script.execute: study_screensaver_timer
- platform: homeassistant
  id: study_zone_1_state
  entity_id: binary_sensor.example_occupancy_zone_1
  internal: true
  on_value:
    - script.execute: study_screensaver_timer
- platform: homeassistant
  id: study_zone_2_state
  entity_id: binary_sensor.example_occupancy_zone_2
  internal: true
  on_value:
    - script.execute: study_screensaver_timer

- platform: debug
  reset_reason:
    id: status_reset_reason
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(status_reset) != nullptr)
              lv_label_set_text(id(status_reset), x.c_str());
- platform: wifi_info
  ip_address:
    id: status_ip_address
    internal: true
  ssid:
    id: status_wifi_ssid
    internal: true
# Retain native startup/reset diagnostics without periodic sensor polling.
debug:
  update_interval: never

script:
  - id: refresh_rack_clock
    # Uppercase date above 24-hour time; only the clock's hour is unpadded.
    mode: restart
    then:
      - lambda: |-
          if (id(rack_date_label) == nullptr || id(rack_clock_label) == nullptr) return;
          auto now = id(rack_clock).now();
          std::string date_text = "--", time_text = "--";
          if (now.is_valid()) {
            date_text = now.strftime("%a %d %b %Y");
            for (char &c : date_text) if (c >= 'a' && c <= 'z') c -= 'a' - 'A';
            time_text = str_sprintf("%u:%02u:%02u", static_cast<unsigned>(now.hour),
                                   static_cast<unsigned>(now.minute), static_cast<unsigned>(now.second));
          }
          if (strcmp(lv_label_get_text(id(rack_date_label)), date_text.c_str()) != 0)
            lv_label_set_text(id(rack_date_label), date_text.c_str());
          if (strcmp(lv_label_get_text(id(rack_clock_label)), time_text.c_str()) != 0)
            lv_label_set_text(id(rack_clock_label), time_text.c_str());

  - id: startup_splash
    # Animate the boot splash, then run the Rack display test.
    # Keep the display awake through both sequences and restart the vacancy timer afterwards.
    mode: single
    then:
    - script.stop: study_screensaver_timer
    - if:
        condition:
          lvgl.is_paused:
            id: ui
        then:
        - lvgl.resume:
            lvgl_id: ui
    - lambda: !lambda |-
        for (auto *obj : {id(startup_splash_overlay), id(splash_logo_curtain), id(splash_title_curtain), id(splash_credit_curtain)})
          lv_anim_delete(obj, nullptr);
        lv_obj_set_style_opa(id(startup_splash_overlay), LV_OPA_COVER, LV_PART_MAIN);
        lv_obj_remove_flag(id(startup_splash_overlay), LV_OBJ_FLAG_HIDDEN);
        lv_obj_set_x(id(splash_logo_curtain), 0);
        lv_obj_set_x(id(splash_title_curtain), 0);
        lv_obj_set_x(id(splash_credit_curtain), 0);
        lv_obj_update_layout(id(startup_splash_overlay));
    - logger.log:
        tag: startup_splash
        format: PatRACK splash started
    - lambda: !lambda |-
        // Share wipe setup; offsets keep visible line reveals sequential.
        auto start_wipe = [](lv_obj_t *curtain, int32_t distance,
                             uint32_t duration_ms, uint32_t start_delay_ms) {
          lv_anim_t wipe;
          lv_anim_init(&wipe);
          lv_anim_set_var(&wipe, curtain);
          lv_anim_set_values(&wipe, 0, distance);
          lv_anim_set_time(&wipe, duration_ms);
          lv_anim_set_delay(&wipe, start_delay_ms);
          lv_anim_set_path_cb(&wipe, lv_anim_path_ease_in_out);
          lv_anim_set_exec_cb(&wipe, [](void *obj, int32_t x) {
            lv_obj_set_x(static_cast<lv_obj_t *>(obj), x);
          });
          lv_anim_start(&wipe);
        };
        // Arguments: which cover, movement distance (px), movement duration (ms),
        // and wait before movement starts (ms, measured from the splash sequence start).
        start_wipe(id(splash_logo_curtain),   1000, 1063,    0);
        start_wipe(id(splash_title_curtain),  1680, 2066,  369);
        start_wipe(id(splash_credit_curtain), 1680, 3042,  731);
    # Preserve about 2.83 s of fully revealed text before fading; this wait yields.
    - delay: 5378ms
    - lambda: !lambda |-
        lv_anim_t fade;
        lv_anim_init(&fade);
        lv_anim_set_var(&fade, id(startup_splash_overlay));
        lv_anim_set_values(&fade, LV_OPA_COVER, LV_OPA_TRANSP);
        lv_anim_set_time(&fade, 563);
        lv_anim_set_exec_cb(&fade, [](void *obj, int32_t opacity) {
          lv_obj_set_style_opa(static_cast<lv_obj_t *>(obj), opacity, LV_PART_MAIN);
        });
        lv_anim_start(&fade);
    - delay: 625ms
    - lvgl.widget.hide: startup_splash_overlay
    - lvgl.page.show: rack_page
    - script.execute: rack_display_test
    - script.wait: rack_display_test
    - script.execute: study_screensaver_timer
    - logger.log:
        tag: startup_splash
        format: Presentation complete

  # Reports and page entry refresh the rack; a one-second tick handles age/status.
  # Once history has its first valid sample, it schedules each minute boundary.
  - id: rack_display_test
    # Ramp all three numeric fields from 10 to 40 C with 0.1 C resolution.
    # Use elapsed time for a 3.99 s target; yield between updates for other components.
    # Hold 40 C for 1 s, then 888.8/full bar for 1 s.
    # Override rendering only: real sensor reports, observed extrema and chart data remain genuine.
    # Mark the UI as DISPLAY TEST, then restore current live/stale readings when finished.
    mode: single
    then:
      - script.stop: study_screensaver_timer
      - lambda: |-
          id(rack_display_test_value) = 10.0f;
          id(rack_display_test_all_segments) = false;
          id(rack_display_test_active) = true;
          id(rack_display_test_start_ms) = millis();
          ESP_LOGI("rack_display_test", "Starting simulated 10 to 40 C ramp (0.1 C resolution, 3990 ms)");
      - script.execute: refresh_rack_values
      - while:
          condition:
            lambda: |-
              return static_cast<uint32_t>(millis() - id(rack_display_test_start_ms)) < 3990U;
          then:
            - delay: 16ms
            - lambda: |-
                const uint32_t elapsed = std::min<uint32_t>(
                    millis() - id(rack_display_test_start_ms), 3990U);
                const uint32_t tenths = 100U + elapsed * 300U / 3990U;
                id(rack_display_test_value) = tenths / 10.0f;
            - script.execute: refresh_rack_values
      - lambda: |-
          id(rack_display_test_value) = 40.0f;
      - script.execute: refresh_rack_values
      - logger.log:
          tag: rack_display_test
          level: INFO
          format: "40 C reached; holding for 1 second"
      - delay: 1s
      - lambda: |-
          id(rack_display_test_all_segments) = true;
          ESP_LOGI("rack_display_test", "All digit/bar segments lit; holding for 1 second");
      - script.execute: refresh_rack_values
      - delay: 1s
      - lambda: |-
          id(rack_display_test_active) = false;
          id(rack_display_test_all_segments) = false;
          ESP_LOGI("rack_display_test", "Display test complete; restoring live readings");
      - script.execute: refresh_rack

  - id: refresh_rack
    # Refresh the rack values, sensor status and history after a report or page entry.
    # Each helper avoids unnecessary changes to widgets or chart data.
    mode: restart
    then:
      - script.execute: refresh_rack_values
      - script.execute: refresh_rack_status
      - script.execute: refresh_rack_history

  - id: refresh_rack_values
    # Update the temperature digits, observed min/max and segmented thermometer only when needed.
    # During the startup display test, render simulated values without changing any sensor data.
    # Unavailable readings hide the live temperature and clear the bar; recorded extrema remain visible.
    mode: restart
    then:
      - lambda: |-
          // Check the date on reports, page refreshes and time sync, not just midnight.
          const auto now = id(rack_clock).now();
          if (now.is_valid()) {
            const uint32_t today = now.year * 1000U + now.day_of_year;
            if (id(rack_extrema_day) != today) {
              id(rack_extrema_day) = today;
              id(rack_sample_min) = NAN;
              id(rack_sample_max) = NAN;
            }
            // Seed a new day from the real current reading, never the display test.
            // If unavailable at midnight, leave both blank until a valid report arrives.
            if (id(rack_sample_seen) && id(rack_source_available)
                && id(ha_api).is_connected_with_state_subscription()) {
              const float value = id(rack_sample_value);
              if (!std::isfinite(id(rack_sample_min)) || value < id(rack_sample_min)) id(rack_sample_min) = value;
              if (!std::isfinite(id(rack_sample_max)) || value > id(rack_sample_max)) id(rack_sample_max) = value;
            }
          }
          if (id(rack_value) == nullptr || id(rack_min_value) == nullptr || id(rack_max_value) == nullptr) return;
          const bool testing = id(rack_display_test_active);
          const bool all_segments = testing && id(rack_display_test_all_segments);
          // Test values affect rendering only. Real reports, extrema, age and
          // chart sampling continue independently throughout the presentation.
          auto set_text = [](lv_obj_t *label, const char *text) {
            if (strcmp(lv_label_get_text(label), text) != 0) lv_label_set_text(label, text);
          };
          set_text(id(rack_temperature_heading), testing ? "DISPLAY TEST" : "RACK TEMPERATURE");
          set_text(id(rack_extrema_note), testing ? "Display test / simulated values"
              : "Observed minimum / maximum since local midnight");
          const bool seen = id(rack_sample_seen);
          const bool fresh = seen && id(rack_source_available)
              && id(ha_api).is_connected_with_state_subscription();
          lv_obj_t *labels[] = {id(rack_value), id(rack_min_value), id(rack_max_value)};
          const float samples[] = {testing ? id(rack_display_test_value) : fresh ? id(rack_sample_value) : NAN,
                                   testing ? id(rack_display_test_value) : seen ? id(rack_sample_min) : NAN,
                                   testing ? id(rack_display_test_value) : seen ? id(rack_sample_max) : NAN};
          static int32_t displayed[] = {INT32_MAX, INT32_MAX, INT32_MAX};
          unsigned changed = 0;
          for (unsigned i = 0; i < 3; ++i) {
            const int32_t tenths = all_segments ? 8888 : std::isfinite(samples[i])
                ? static_cast<int32_t>(lroundf(samples[i] * 10.0f)) : INT32_MIN;
            if (tenths == displayed[i]) continue;
            char text[16];
            if (tenths == INT32_MIN) snprintf(text, sizeof(text), " --.-");
            else snprintf(text, sizeof(text), "%5.1f", tenths / 10.0f);
            lv_label_set_text(labels[i], text);
            ++changed;
            displayed[i] = tenths;
          }
          if (changed != 0) ESP_LOGD("rack_values", "LCD values updated: %u labels", changed);
          // Segmented LCD: ten 2.5 C bands from 15 to 40 C, bottom to top.
          // The first blue band also indicates below-scale cold readings;
          // above-scale readings saturate at ten. Missing/stale data lights none.
          const float temperature = testing ? id(rack_display_test_value) : id(rack_sample_value);
          const int lit = all_segments ? 10 : (testing || fresh) && std::isfinite(temperature)
              ? std::max(1, std::min(10, 1 + static_cast<int>(floorf((temperature - 15.0f) / 2.5f)))) : 0;
          static int previous_lit = -1;
          if (lit != previous_lit) {
            lv_obj_t *segments[] = {id(rack_bar_0), id(rack_bar_1), id(rack_bar_2), id(rack_bar_3), id(rack_bar_4), id(rack_bar_5), id(rack_bar_6), id(rack_bar_7), id(rack_bar_8), id(rack_bar_9)};
            const uint32_t colors[] = {0x2466AF, 0x2181A0, 0x289077, 0x3E984F, 0x6E9D45, 0x919D3F, 0xBD8B32, 0xC76A30, 0xBB4C35, 0xAD3838};
            for (int i = 0; i < 10; ++i) {
              lv_obj_set_style_bg_color(segments[i], lv_color_hex(i < lit ? colors[i] : ${color_lcd_segment_off}), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(segments[i], static_cast<lv_opa_t>(i < lit ? 153 : 255), LV_PART_MAIN);
            }
            previous_lit = lit;
            ESP_LOGD("rack_bar", "Temperature bar: %d/10 segments", lit);
          }
          // End segmented LCD update.
      - script.execute: refresh_rack_bars

  - id: refresh_rack_bars
    # Reuse real minute history; the accelerated LCD test overrides rendering only.
    mode: restart
    then:
      - lambda: |-
          const uint32_t elapsed = id(rack_display_test_active)
              ? std::min<uint32_t>(millis() - id(rack_display_test_start_ms), 3990U) : 0U;
          rack_history::bars().refresh(id(rack_bar_history_host), id(rack_bar_history_min),
                                      id(rack_bar_history_max), id(rack_bar_history_title),
                                      id(rack_display_test_active), elapsed);

  - id: refresh_rack_status
    # Update HA source availability and last valid HA update age.
    # Refresh the live digits and thermometer when sensor freshness changes.
    mode: restart
    then:
      - lambda: |-
          if (id(rack_link_state) == nullptr || id(rack_sample_age) == nullptr) return;
          const bool seen = id(rack_sample_seen);
          const uint32_t age = seen ? millis() - id(rack_last_sample_ms) : 0;
          const bool ha_connected = id(ha_api).is_connected_with_state_subscription();
          // Await a new imported value after an observed HA disconnection.
          if (!ha_connected) id(rack_source_available) = false;
          const bool fresh = seen && id(rack_source_available) && ha_connected;
          int state = 0;
          const char *text = "WAITING FOR SENSOR";
          if (!ha_connected) {
            state = 3;
            text = "HA OFFLINE";
          } else if (fresh) {
            state = 2;
            text = "LIVE SENSOR";
          } else if (seen) {
            state = 1;
            text = "SENSOR UNAVAILABLE";
          }
          static int previous_state = -1;
          static bool previous_fresh = false;
          if (state != previous_state) {
            lv_label_set_text(id(rack_link_state), text);
            lv_obj_set_style_text_color(id(rack_link_state), lv_color_hex(fresh ? 0x1E4A29 : 0x725127), LV_PART_MAIN);
            ESP_LOGD("rack_status", "%s", text);
            previous_state = state;
          }
          // A lost/recovered link changes the main number even without a new
          // temperature. Historical extrema remain visible while unavailable.
          if (fresh != previous_fresh) {
            previous_fresh = fresh;
            id(refresh_rack_values).execute();
          }
          static uint32_t previous_age_seconds = UINT32_MAX;
          const uint32_t age_seconds = seen ? age / 1000U : UINT32_MAX;
          if (age_seconds != previous_age_seconds) {
            char text[112];
            snprintf(text, sizeof(text), "TMP117 / Atom S3R  |  Last HA update: %u seconds ago", static_cast<unsigned>(age_seconds));
            lv_label_set_text(id(rack_sample_age), text);
            previous_age_seconds = age_seconds;
          }

  - id: refresh_rack_history
    # Create and maintain the four-hour chart: 241 points, sampled once per minute in RAM.
    # Leave gaps while HA/source data is unavailable; otherwise sample the current HA value.
    # A single named scheduler timeout maintains sampling even with no new reports.
    mode: restart
    then:
      - lambda: |-
          if (id(rack_history_host) == nullptr || id(rack_history_min) == nullptr || id(rack_history_max) == nullptr) return;
          const bool fresh = id(rack_sample_seen) && id(rack_source_available)
              && id(ha_api).is_connected_with_state_subscription();
          const float value = id(rack_sample_value);
          // Four hours at one point per minute: 241 points span 240 intervals.
          // History lives in RAM and starts empty after a restart. Unavailable
          // minutes remain gaps; unchanged valid HA values are sampled normally.
          static lv_obj_t *chart = nullptr;
          static lv_chart_series_t *series = nullptr;
          static uint32_t last_slot_ms = 0;
          static bool history_started = false;
          if (chart == nullptr) {
            chart = lv_chart_create(id(rack_history_host));
            lv_obj_remove_style_all(chart);
            lv_obj_set_size(chart, 692, 84);
            lv_obj_set_pos(chart, 0, 0);
            lv_obj_remove_flag(chart, LV_OBJ_FLAG_SCROLLABLE);
            lv_obj_remove_flag(chart, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_add_flag(chart, LV_OBJ_FLAG_GESTURE_BUBBLE);
            lv_obj_set_style_line_color(chart, lv_color_hex(${color_lcd_segment_off}), LV_PART_MAIN);
            lv_obj_set_style_line_width(chart, 1, LV_PART_MAIN);
            lv_obj_set_style_line_width(chart, 2, LV_PART_ITEMS);
            lv_obj_set_style_width(chart, 4, LV_PART_INDICATOR);
            lv_obj_set_style_height(chart, 4, LV_PART_INDICATOR);
            lv_obj_set_style_bg_color(chart, lv_color_hex(${color_lcd_ink}), LV_PART_INDICATOR);
            lv_obj_set_style_bg_opa(chart, LV_OPA_COVER, LV_PART_INDICATOR);
            lv_chart_set_type(chart, LV_CHART_TYPE_LINE);
            lv_chart_set_point_count(chart, 241);
            lv_chart_set_update_mode(chart, LV_CHART_UPDATE_MODE_SHIFT);
            lv_chart_set_div_line_count(chart, 3, 5);
            series = lv_chart_add_series(chart, lv_color_hex(${color_lcd_ink}), LV_CHART_AXIS_PRIMARY_Y);
            lv_chart_set_all_values(chart, series, LV_CHART_POINT_NONE);
            lv_chart_set_axis_range(chart, LV_CHART_AXIS_PRIMARY_Y, 0, 10);
            ESP_LOGI("rack_history", "Four-hour chart ready: 241 points, one minute apart");
          }
          const uint32_t now = millis();
          bool changed = false;
          if (!history_started && fresh) {
            lv_chart_set_next_value(chart, series, static_cast<int32_t>(lroundf(value * 10.0f)));
            history_started = true;
            last_slot_ms = now;
            changed = true;
          } else if (history_started && now - last_slot_ms >= 60000U) {
            const uint32_t elapsed = (now - last_slot_ms) / 60000U;
            // Cap catch-up work after an unusually long blocked loop.
            if (elapsed >= 241U) lv_chart_set_all_values(chart, series, LV_CHART_POINT_NONE);
            const uint32_t gaps = elapsed < 241U ? elapsed - 1U : 0U;
            for (uint32_t i = 0; i < gaps; ++i)
              lv_chart_set_next_value(chart, series, LV_CHART_POINT_NONE);
            lv_chart_set_next_value(chart, series, fresh ? static_cast<int32_t>(lroundf(value * 10.0f)) : LV_CHART_POINT_NONE);
            last_slot_ms += elapsed * 60000U;
            changed = true;
          }
          if (changed) {
            int32_t minimum = INT32_MAX, maximum = INT32_MIN;
            unsigned count = 0;
            const int32_t *points = lv_chart_get_series_y_array(chart, series);
            for (unsigned i = 0; i < 241; ++i) {
              if (points[i] == LV_CHART_POINT_NONE) continue;
              minimum = std::min(minimum, points[i]);
              maximum = std::max(maximum, points[i]);
              ++count;
            }
            if (count != 0) {
              // Auto-scale in half-degree steps, with at least 0.5 C padding.
              const int32_t low = static_cast<int32_t>(floorf((minimum - 5) / 5.0f)) * 5;
              const int32_t high = static_cast<int32_t>(ceilf((maximum + 5) / 5.0f)) * 5;
              lv_chart_set_axis_range(chart, LV_CHART_AXIS_PRIMARY_Y, low, high);
              lv_label_set_text(id(rack_history_max), str_sprintf("%.1f", high / 10.0f).c_str());
              lv_label_set_text(id(rack_history_min), str_sprintf("%.1f", low / 10.0f).c_str());
            } else {
              lv_label_set_text(id(rack_history_max), "--");
              lv_label_set_text(id(rack_history_min), "--");
            }
            lv_chart_refresh(chart);
            rack_history::bars().update_history(points, lv_chart_get_x_start_point(chart, series));
            id(refresh_rack_bars).execute();
            ESP_LOGD("rack_history", "History: %u valid minute points, latest %s", count, fresh ? "fresh" : "missing");
          }
          if (history_started) {
            // Replacing this named timeout keeps exactly one next sample pending.
            // Use the existing slot boundary, so reports cannot postpone sampling.
            const uint32_t elapsed_ms = millis() - last_slot_ms;
            const uint32_t wait_ms = elapsed_ms < 60000U ? 60000U - elapsed_ms : 1U;
            App.scheduler.set_timeout(id(ui), "rack_history_sample", wait_ms,
                []() { id(refresh_rack_history).execute(); });
          }

  # Restart on sensor changes and touch release. Only known vacancy can time out.
  - id: study_screensaver_timer
    mode: restart
    then:
      - if:
          condition:
            lvgl.is_paused:
              id: ui
          then:
            - lvgl.resume:
                lvgl_id: ui
      - if:
          condition:
            lambda: |-
              return id(study_pir_state).state == "off"
                  && id(study_zone_1_state).state == "off"
                  && id(study_zone_2_state).state == "off";
          then:
            - delay: 20min
            - if:
                condition:
                  lambda: |-
                    return id(study_pir_state).state == "off"
                        && id(study_zone_1_state).state == "off"
                        && id(study_zone_2_state).state == "off";
                then:
                  - lambda: |-
                      // Flush black pixels before pausing; paused LVGL suppresses display writes.
                      lv_obj_remove_flag(id(screensaver_black_overlay), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_move_foreground(id(screensaver_black_overlay));
                      lv_refr_now(id(ui).get_disp());
                  - lvgl.pause:
                      lvgl_id: ui
  - id: refresh_status
    # Refresh live Status-page network, HA connection, uptime and CPU temperature.
    # Skip unchanged labels; fixed ESPHome/MCU/build text is set when widgets are created.
    mode: restart
    then:
      - lambda: |-
          if (id(status_uptime) == nullptr || id(brightness_value) == nullptr) return;
          auto set_text = [](lv_obj_t *label, const char *text) {
            if (strcmp(lv_label_get_text(label), text) != 0) lv_label_set_text(label, text);
          };
          char text[128];
          set_text(id(status_ssid), id(status_wifi_ssid).has_state()
              ? id(status_wifi_ssid).state.c_str() : "--");
          set_text(id(status_ip), id(status_ip_address).has_state()
              ? id(status_ip_address).state.c_str() : "--");
          set_text(id(status_ha), id(ha_api).is_connected_with_state_subscription() ? "connected" : "offline");
          // Validate before converting to an integer; clear invalid readings.
          const float uptime = id(status_uptime_seconds).state;
          if (std::isfinite(uptime) && uptime >= 0.0f && uptime < 4294967296.0) {
            const uint32_t seconds = static_cast<uint32_t>(uptime);
            snprintf(text, sizeof(text), "%ud %02uh %02um", static_cast<unsigned>(seconds / 86400), static_cast<unsigned>((seconds / 3600) % 24), static_cast<unsigned>((seconds / 60) % 60));
            set_text(id(status_uptime), text);
          } else set_text(id(status_uptime), "--");
          if (std::isfinite(id(status_die_temperature).state)) {
            snprintf(text, sizeof(text), "%.1f °C", id(status_die_temperature).state);
            set_text(id(status_cpu_temp), text);
          } else set_text(id(status_cpu_temp), "--");
          const float rssi = id(panel_wifi_rssi).state;
          if (std::isfinite(rssi) && rssi >= -128.0f && rssi <= 0.0f) {
            snprintf(text, sizeof(text), "%d dBm", static_cast<int>(rssi));
            set_text(id(wifi_rssi_label), text);
          } else set_text(id(wifi_rssi_label), "--");
interval:
  # Only age/status runs each second; history schedules its own minute samples.
  # Numerical LCD labels update on reports or freshness transitions.
  - interval: 1s
    then:
      - script.execute: refresh_rack_status
  - interval: 5s
    then:
      - if:
          condition:
            lvgl.page.is_showing: status_page
          then:
            - script.execute: refresh_status

